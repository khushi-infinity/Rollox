<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Rollox — Miniature Mixed-Reality Bowling</title>
    <meta
      name="description"
      content="Hands-first miniature mixed-reality bowling game built with Meta IWSDK: pinch, pull, aim, and roll through fantasy lanes."
    />
    <meta property="og:title" content="Rollox — Miniature Mixed-Reality Bowling" />
    <meta
      property="og:description"
      content="Hands-first miniature mixed-reality bowling game built with Meta IWSDK: pinch, pull, aim, and roll through fantasy lanes."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230ea5e9'/%3E%3Ccircle cx='24' cy='22' r='4' fill='%23020617'/%3E%3Ccircle cx='36' cy='20' r='4' fill='%23020617'/%3E%3Ccircle cx='31' cy='30' r='4' fill='%23020617'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div id="scene-container"></div>
    <div
      id="rollox-result-overlay"
      class="result-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="res-title"
      data-tone="success"
    >
      <div class="result-card">
        <div id="res-eyebrow" class="result-eyebrow">LEVEL COMPLETED!</div>
        <div id="res-level-name" class="result-level-name">Level 1: Meadow Straight</div>
        <h2 id="res-title" class="result-title">STRIKE! +50 BONUS</h2>
        <div id="res-stars" class="result-stars" aria-label="Star rating">★★★ (3 / 3 STARS)</div>
        <div id="res-banner" class="result-banner">Level cleared — next challenge unlocked!</div>
        <p id="res-summary" class="result-summary">Clean sweep in 1 shot!</p>

        <div class="result-stats">
          <div class="result-stat">
            <span class="result-stat-label">PINS KNOCKED</span>
            <span id="res-pins-val" class="result-stat-val">10 / 10</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-label">FINAL SCORE</span>
            <span id="res-score-val" class="result-stat-val">150</span>
          </div>
          <div class="result-stat">
            <span id="res-best-label" class="result-stat-label">BEST SCORE</span>
            <span id="res-best-val" class="result-stat-val">150</span>
          </div>
        </div>

        <div class="result-actions">
          <button id="res-btn-resume" class="result-btn result-btn-primary hidden" type="button">
            Resume Game
          </button>
          <button id="res-btn-next" class="result-btn result-btn-primary hidden" type="button">
            Next Level →
          </button>
          <button id="res-btn-retry" class="result-btn result-btn-secondary" type="button">
            Play Again
          </button>
          <div class="result-actions-row">
            <button id="res-btn-levels" class="result-btn result-btn-secondary" type="button">
              Other Levels
            </button>
            <button id="res-btn-edit" class="result-btn result-btn-secondary hidden" type="button">
              Edit Setup
            </button>
            <button id="res-btn-settings" class="result-btn result-btn-secondary hidden" type="button">
              Settings
            </button>
            <button id="res-btn-menu" class="result-btn result-btn-ghost" type="button">
              Main Menu
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="xr-entry-dock" aria-label="Mixed Reality Controls">
      <div class="dock-brand">
        <div class="dock-brand-row">
          <span class="dock-title">ROLLOX</span>
          <span id="xr-status-badge" class="dock-badge" data-tone="checking">CHECKING WEBXR...</span>
        </div>
        <span id="xr-diagnostic-text" class="dock-diagnostic">Checking navigator.xr and immersive-ar support...</span>
      </div>
      <div class="dock-actions">
        <button id="btn-enter-xr" type="button" disabled>Checking WebXR...</button>
        <button id="btn-desktop-recenter" class="dock-secondary" type="button">Recenter</button>
        <button id="btn-desktop-unstick" class="dock-secondary" type="button">Unstick Ball</button>
        <button id="btn-perf-mode" class="dock-secondary" type="button">Low-Lag: OFF</button>
        <button id="btn-desktop-menu" class="dock-secondary" type="button">Menu</button>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
